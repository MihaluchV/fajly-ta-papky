<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Файли та папки — інтерактивне завдання</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef4f7;--card:#fff;--tx:#12303a;--mut:#5a7480;--pri:#0f5c6e;--prit:#fff;--fold:#f5b921;--ok:#237f4a;--okb:#dff3e7;--bad:#c23b3b;--badb:#fbe3e3;--bd:#cfdde3;--sel:#d6eef5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b21;--card:#16282f;--tx:#e6f1f5;--mut:#9bb4be;--pri:#59b6cc;--prit:#06232b;--ok:#6fd199;--okb:#173a28;--bad:#f08a8a;--badb:#3d1c1c;--bd:#2c4651;--sel:#1f4352}}
:root[data-theme="dark"]{--bg:#0e1b21;--card:#16282f;--tx:#e6f1f5;--mut:#9bb4be;--pri:#59b6cc;--prit:#06232b;--ok:#6fd199;--okb:#173a28;--bad:#f08a8a;--badb:#3d1c1c;--bd:#2c4651;--sel:#1f4352}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Nunito,system-ui,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:0 0 6px;line-height:1.2}h2{font-size:20px;margin:0 0 10px}
p{margin:0 0 10px}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
button,input{font:inherit;color:inherit}
.btn{background:var(--pri);color:var(--prit);border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}
.btn.g{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--fold);outline-offset:2px}
input[type=text]{background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--fold)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad)}
.fb{padding:10px 12px;border-radius:10px;margin-top:8px;font-weight:700}.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--badb);color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tools .btn{padding:7px 11px;font-size:14px}
.path{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-weight:700;overflow-x:auto;white-space:nowrap}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;min-height:150px;border:2px dashed var(--bd);border-radius:10px;padding:10px;margin-top:8px}
.it{text-align:center;padding:8px 4px;border-radius:10px;border:2px solid transparent;background:transparent;cursor:pointer;word-break:break-word;font-size:14px}
.it span{display:block;font-size:34px;line-height:1.2}.it.s{background:var(--sel);border-color:var(--pri)}.it.c{opacity:.5}
.empty{grid-column:1/-1;align-self:center;text-align:center;color:var(--mut)}
.task{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.task:last-child{border:0}
.task b{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:14px}
.task.d b{background:var(--ok);border-color:var(--ok);color:#fff}.task.d{color:var(--mut)}
.status{min-height:24px;font-weight:700;color:var(--pri);margin-top:6px}
.row{display:flex;gap:8px}.row>*{flex:1}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.big{font-size:44px;font-weight:800;color:var(--pri);line-height:1}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;font:14px/1.4 ui-monospace,monospace}
.ov{position:fixed;inset:0;background:rgba(10,25,31,.55);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--card);border:1px solid var(--bd);border-radius:14px;max-width:380px;width:100%;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dlg h2{display:flex;gap:8px;align-items:center}.dlg .it{display:flex;gap:10px;align-items:center;text-align:left;cursor:default;background:var(--bg);margin:10px 0;font-weight:700}.dlg .it span{display:inline;font-size:30px}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const Q=[
{q:"Що таке файл?",o:["Місце для зберігання папок","Іменована область даних на носії (текст, малюнок, пісня тощо)","Програма для малювання","Частина монітора"],a:1,e:"Файл — це інформація, збережена під певним іменем."},
{q:"Яке розширення має звичайний текстовий файл?",o:[".mp3",".png",".txt",".exe"],a:2,e:"Розширення .txt — текстовий файл. .mp3 — звук, .png — малюнок."},
{q:"Для чого потрібні папки?",o:["Щоб прискорити інтернет","Щоб упорядковувати файли та групувати їх за темами","Щоб малювати","Щоб вимикати комп'ютер"],a:1,e:"Папки (каталоги) допомагають тримати файли в порядку."},
{q:"Яка операція створює копію файлу, а оригінал залишає на місці?",o:["Копіювати","Перемістити","Видалити","Перейменувати"],a:0,e:"Після копіювання файл є і на старому, і на новому місці."},
{q:"Яке ім'я файлу вказано правильно?",o:["урок/1.txt","урок?.txt","урок:1.txt","урок_1.txt"],a:3,e:"В іменах не можна використовувати символи \\ / : * ? \" < > |"},
{q:"Що відбувається з файлом під час переміщення?",o:["Він з'являється в новому місці, а зі старого зникає","Він залишається на обох місцях","Він зникає назавжди","Він змінює розширення"],a:0,e:"Переміщення = вирізати + вставити."}];
const T=[
{t:"Створи на «Робочому столі» папку з назвою «Школа».",c:()=>!!sub(dir('Робочий стіл'),'Школа','d')},
{t:"У папці «Документи» перейменуй файл «список.txt» на «уроки.txt».",c:()=>{const d=dir('Документи');return !!sub(d,'уроки.txt','f')&&!sub(d,'список.txt','f')}},
{t:"Скопіюй файл «кіт.png» у папку «Школа». Оригінал має залишитися в «Малюнках».",c:()=>{const s=sub(dir('Робочий стіл'),'Школа','d');return !!(s&&sub(s,'кіт.png','f')&&sub(dir('Малюнки'),'кіт.png','f'))}},
{t:"Перемісти файл «реферат.docx» з «Документів» у папку «Школа».",c:()=>{const s=sub(dir('Робочий стіл'),'Школа','d');return !!(s&&sub(s,'реферат.docx','f')&&!sub(dir('Документи'),'реферат.docx','f'))}},
{t:"Видали файл «пісня.mp3» з папки «Музика».",c:()=>!sub(dir('Музика'),'пісня.mp3','f')}];
let uid,root,cur,sel,clip,ib,msg,dlg=null,S={step:'intro',name:'',cls:'',qi:0,ans:[],pick:null,acts:0};
const mk=(n,t,c)=>({id:++uid,name:n,t,c:c||[]});
function init(){uid=0;root=mk("Мій комп'ютер",'d',[mk('Робочий стіл','d'),mk('Документи','d',[mk('реферат.docx','f'),mk('список.txt','f')]),mk('Малюнки','d',[mk('кіт.png','f'),mk('сонце.png','f')]),mk('Музика','d',[mk('пісня.mp3','f')])]);cur=[root];sel=null;clip=null;ib=null;dlg=null;msg='';S.acts=0}
const dir=n=>root.c.find(x=>x.name===n);
const sub=(d,n,t)=>d&&d.c.find(x=>x.name===n&&x.t===t);
const fold=()=>cur[cur.length-1];
function find(id,n=root,p=null){if(n.id===id)return{n,p};for(const x of n.c){const r=find(id,x,n);if(r)return r}return null}
const cl=n=>({...n,id:++uid,c:n.c.map(cl)});
const ic=n=>n.t==='d'?'📁':({txt:'📄',docx:'📝',png:'🖼️',jpg:'🖼️',mp3:'🎵'}[n.name.split('.').pop()]||'📄');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const app=$('app');
function go(s){S.step=s;render();window.scrollTo(0,0)}
function render(){({intro,quiz,prac,result})[S.step]()}
function intro(){app.innerHTML=`<div class="card"><h1>📁 Файли та папки</h1><p class="mut">Інформатика, 5 клас. Завдання має дві частини: <b>тест</b> (6 питань) і <b>практика</b> у віртуальному комп'ютері (5 завдань). Наприкінці ти отримаєш звіт для вчителя.</p>
<p><label>Прізвище та ім'я<input type="text" id="nm" value="${esc(S.name)}" autocomplete="off"></label></p>
<p><label>Клас<input type="text" id="cl" value="${esc(S.cls)}" placeholder="наприклад, 5-А" autocomplete="off"></label></p>
<button class="btn" onclick="start()">Почати</button><div class="status" id="er"></div></div>`}
function start(){S.name=$('nm').value.trim();S.cls=$('cl').value.trim();if(!S.name){$('er').textContent='Спочатку введи прізвище та ім\'я.';return}
S.qi=0;S.ans=[];S.pick=null;init();go('quiz')}
function quiz(){const q=Q[S.qi],p=S.pick;
app.innerHTML=`<div class="bar"><i style="width:${S.qi/Q.length*100}%"></i></div><div class="card"><p class="mut">Частина 1. Питання ${S.qi+1} з ${Q.length}</p><h2>${q.q}</h2>
${q.o.map((o,i)=>`<button class="opt ${p===null?'':i===q.a?'ok':i===p?'bad':''}" ${p===null?'':'disabled'} onclick="pick(${i})">${esc(o)}</button>`).join('')}
${p===null?'':`<div class="fb ${p===q.a?'ok':'bad'}">${p===q.a?'Вірно! ':'Не зовсім. '}${esc(q.e)}</div><p style="margin-top:12px"><button class="btn" onclick="nextQ()">${S.qi<Q.length-1?'Далі':'До практики'}</button></p>`}</div>`}
function pick(i){if(S.pick!==null)return;S.pick=i;S.ans[S.qi]=i;quiz()}
function nextQ(){S.pick=null;if(S.qi<Q.length-1){S.qi++;quiz()}else go('prac')}
function prac(){const f=fold(),items=f.c.slice().sort((a,b)=>(a.t<b.t?-1:a.t>b.t?1:a.name.localeCompare(b.name)));
const s=sel&&find(sel)?find(sel).n:null,done=T.map(t=>t.c()),n=done.filter(Boolean).length;
app.innerHTML=`<div class="card"><p class="mut">Частина 2. Практика</p><h2>Віртуальний комп'ютер</h2>
${T.map((t,i)=>`<div class="task ${done[i]?'d':''}"><b>${done[i]?'✓':i+1}</b><span>${t.t}</span></div>`).join('')}</div>
<div class="card"><div class="path"><button class="btn g" style="padding:4px 10px" onclick="up()" ${cur.length<2?'disabled':''}>⬆ Вгору</button>${cur.map(x=>esc(x.name)).join(' › ')}</div>
<div class="tools">
<button class="btn" onclick="ask('new')">➕ Нова папка</button>
<button class="btn" onclick="openF()" ${s&&s.t==='d'?'':'disabled'}>📂 Відкрити</button>
<button class="btn" onclick="ask('ren')" ${s?'':'disabled'}>✏️ Перейменувати</button>
<button class="btn" onclick="setClip('copy')" ${s?'':'disabled'}>📋 Копіювати</button>
<button class="btn" onclick="setClip('cut')" ${s?'':'disabled'}>✂️ Вирізати</button>
<button class="btn" onclick="paste()" ${clip?'':'disabled'}>📥 Вставити</button>
<button class="btn" onclick="del()" ${s?'':'disabled'}>🗑️ Видалити</button></div>
${ib?`<div class="row"><input type="text" id="inp" autocomplete="off" value="${ib==='ren'&&s?esc(s.name):''}" placeholder="${ib==='new'?'Назва нової папки':'Нове ім\'я'}"><button class="btn" style="flex:none" onclick="okIn()">OK</button><button class="btn g" style="flex:none" onclick="ib=null;prac()">Скасувати</button></div>`:''}
<div class="files">${items.length?items.map(x=>`<button class="it ${x.id===sel?'s':''} ${clip&&clip.id===x.id&&clip.m==='cut'?'c':''}" onclick="selIt(${x.id})" ondblclick="selIt(${x.id});openF()"><span>${ic(x)}</span>${esc(x.name)}</button>`).join(''):'<div class="empty">Ця папка порожня</div>'}</div>
<div class="status">${esc(msg)}</div></div>
<div class="row noprint"><button class="btn g" onclick="dlg={k:'reset'};prac()">↺ Спочатку</button><button class="btn" onclick="go('result')">Завершити (${n} з ${T.length})</button></div>${dlg?modal():''}`;
if(dlg){const b=$('no');if(b)b.focus()}
if(ib){const i=$('inp');i.focus();i.select();i.onkeydown=e=>{if(e.key==='Enter')okIn()}}}
function selIt(id){sel=id;msg='';ib=null;prac()}
function up(){if(cur.length>1){cur.pop();sel=null;msg='';prac()}}
function openF(){const r=find(sel);if(r&&r.n.t==='d'){cur.push(r.n);sel=null;msg='';prac()}}
function ask(m){ib=m;prac()}
function okIn(){const v=$('inp').value.trim(),f=fold();
if(!v){msg='Введи назву.';ib=null;return prac()}
if(/[\\\/:*?"<>|]/.test(v)){msg='Назва містить заборонений символ: \\ / : * ? " < > |';return prac()}
if(f.c.some(x=>x.name===v&&x.id!==sel)){msg='У цій папці вже є об\'єкт з такою назвою.';return prac()}
if(ib==='new'){f.c.push(mk(v,'d'));msg='Створено папку «'+v+'».'}else{const r=find(sel);r.n.name=v;msg='Перейменовано на «'+v+'».'}
S.acts++;ib=null;prac()}
function setClip(m){clip={id:sel,m};msg=m==='copy'?'Скопійовано. Відкрий потрібну папку й натисни «Вставити».':'Вирізано. Відкрий потрібну папку й натисни «Вставити».';prac()}
function paste(){const r=find(clip.id);if(!r){clip=null;msg='Об\'єкта вже немає.';return prac()}
const f=fold();if(cur.includes(r.n)){msg='Не можна вставити папку саму в себе.';return prac()}
let nm=r.n.name;if(f.c.some(x=>x.name===nm)){if(clip.m==='cut'&&r.p===f){clip=null;return prac()}nm+=' (копія)'}
if(clip.m==='copy'){const c=cl(r.n);c.name=nm;f.c.push(c);msg='Копію вставлено.'}
else{r.p.c=r.p.c.filter(x=>x!==r.n);r.n.name=nm;f.c.push(r.n);clip=null;msg='Об\'єкт переміщено.'}
S.acts++;prac()}
function del(){const r=find(sel);if(!r||!r.p)return;ib=null;dlg={k:'del',id:sel};prac()}
function modal(){if(dlg.k==='reset')return `<div class="ov"><div class="dlg" role="dialog" aria-modal="true"><h2>↺ Почати спочатку?</h2><p>Усі зміни у віртуальному комп'ютері буде скасовано.</p><div class="row"><button class="btn" id="yes" onclick="dlgYes()">Так</button><button class="btn g" id="no" onclick="dlgNo()">Ні</button></div></div></div>`;
const r=find(dlg.id);if(!r){dlg=null;return ''}const d=r.n.t==='d';
return `<div class="ov"><div class="dlg" role="dialog" aria-modal="true"><h2>🗑️ Видалення ${d?'папки':'файлу'}</h2><p>${d?'Ви впевнені, що хочете видалити цю папку разом з усім її вмістом?':'Ви впевнені, що хочете видалити цей файл?'}</p><div class="it"><span>${ic(r.n)}</span>${esc(r.n.name)}</div><div class="row"><button class="btn" id="yes" onclick="dlgYes()">Так</button><button class="btn g" id="no" onclick="dlgNo()">Ні</button></div></div></div>`}
function dlgNo(){dlg=null;prac()}
function dlgYes(){const k=dlg;dlg=null;if(k.k==='reset'){init();return prac()}
const r=find(k.id);if(!r||!r.p)return prac();r.p.c=r.p.c.filter(x=>x!==r.n);if(clip&&clip.id===k.id)clip=null;msg='Видалено «'+r.n.name+'».';sel=null;S.acts++;prac()}
function result(){const qs=S.ans.map((a,i)=>a===Q[i].a),qn=qs.filter(Boolean).length,ts=T.map(t=>t.c()),tn=ts.filter(Boolean).length,
tot=qn+tn,max=Q.length+T.length,gr=Math.max(1,Math.round(tot/max*12));
const rep='Звіт про виконання завдання «Файли та папки» — у вкладенні (картинка).\nУчень: '+S.name+(S.cls?' ('+S.cls+')':'');
const img=drawRep({name:S.name,cls:S.cls,qs,ts,qn,tn,gr});
const subj=encodeURIComponent('Файли та папки — '+S.name+(S.cls?' ('+S.cls+')':'')),bod=encodeURIComponent(rep);
app.innerHTML=`<div class="card"><h1>Готово, ${esc(S.name.split(' ').slice(-1)[0])}!</h1><p class="mut">${esc(S.name)}${S.cls?', '+esc(S.cls):''}</p>
<div class="row" style="margin:14px 0"><div><div class="big">${qn}/${Q.length}</div><p class="mut">теорія</p></div><div><div class="big">${tn}/${T.length}</div><p class="mut">практика</p></div><div><div class="big">${gr}</div><p class="mut">з 12 (орієнтовно)</p></div></div>
<table><tr><th>Теорія</th><th></th></tr>${Q.map((q,i)=>`<tr><td>${esc(q.q)}${qs[i]?'':`<br><span class="mut">Правильно: ${esc(q.o[q.a])}</span>`}</td><td>${qs[i]?'✅':'❌'}</td></tr>`).join('')}</table>
<table style="margin-top:12px"><tr><th>Практика</th><th></th></tr>${T.map((t,i)=>`<tr><td>${t.t}</td><td>${ts[i]?'✅':'❌'}</td></tr>`).join('')}</table></div>
<div class="card"><h2>Звіт для вчителя</h2><img src="${img}" alt="Звіт" style="width:100%;border:1px solid var(--bd);border-radius:10px">
<p class="mut" style="margin-top:10px">1. Натисни «Скопіювати картинку». 2. Відкрий лист кнопкою нижче. 3. Встав картинку в текст листа (Ctrl+V, на телефоні — утримуй палець у тексті й обери «Вставити») і надішли.</p>
<p class="noprint"><button class="btn" style="width:100%" onclick="copyPic()">🖼️ Скопіювати картинку</button></p>
<p class="noprint"><a class="btn" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="mailto:v.0950851274@gmail.com?subject=${subj}&body=${bod}">✉️ Лист через поштову програму</a></p>
<p class="noprint"><a class="btn g" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://mail.google.com/mail/?view=cm&fs=1&to=v.0950851274@gmail.com&su=${subj}&body=${bod}">Лист через Gmail у браузері</a></p>
<div class="row noprint"><button class="btn g" onclick="savePic()">💾 Зберегти файлом</button><button class="btn g" onclick="window.print()">🖨️ Друк</button><button class="btn g" onclick="S.step='intro';S.name='';render()">Спробувати знову</button></div><div class="status" id="cs"></div></div>`}
function drawRep(o){const W=800,H=250+(Q.length+T.length)*32+70,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),F=(w,z)=>x.font=w+' '+z+'px Nunito,sans-serif';
x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#0f5c6e';x.fillRect(0,0,W,90);x.fillStyle='#fff';F(800,30);x.fillText('Файли та папки — звіт',30,42);F(700,18);x.fillText('Інформатика, 5 клас',30,72);
x.fillStyle='#12303a';F(800,26);x.fillText(o.name+(o.cls?', '+o.cls:''),30,135);F(700,20);x.fillText('Теорія: '+o.qn+'/'+Q.length+'     Практика: '+o.tn+'/'+T.length+'     Оцінка: '+o.gr+'/12',30,172);
let y=215;const sec=(t,arr,lab)=>{x.fillStyle='#0f5c6e';F(800,20);x.fillText(t,30,y);y+=30;arr.forEach((v,i)=>{x.fillStyle='#12303a';F(400,17);x.fillText(lab(i),30,y);x.fillStyle=v?'#dff3e7':'#fbe3e3';x.fillRect(640,y-19,130,26);x.fillStyle=v?'#237f4a':'#c23b3b';F(800,16);x.fillText(v?'Вірно':'Помилка',v?675:665,y);y+=32});y+=6};
sec('Теорія',o.qs,i=>'Питання '+(i+1));sec('Практика',o.ts,i=>PL[i]);
const d=new Date().toLocaleString('uk-UA');let h=0;for(const ch of o.name+o.cls+o.qn+o.tn+d)h=(h*31+ch.charCodeAt(0))>>>0;
x.fillStyle='#5a7480';F(400,14);x.fillText('Сформовано: '+d+'     Код: '+h.toString(36).toUpperCase(),30,H-22);
c.toBlob(b=>window.REPBLOB=b,'image/png');return c.toDataURL('image/png')}
const PL=['Створити папку «Школа»','Перейменувати файл','Скопіювати файл','Перемістити файл','Видалити файл'];
async function copyPic(){const st=$('cs');
try{if(!window.REPBLOB||!window.ClipboardItem)throw 0;await navigator.clipboard.write([new ClipboardItem({'image/png':window.REPBLOB})]);st.textContent='Картинку скопійовано. Відкрий лист і встав її в текст (Ctrl+V).'}
catch(e){st.textContent='Не вдалося скопіювати. Натисни «Зберегти файлом» і прикріпи картинку до листа.'}}
async function savePic(){const st=$('cs'),hint='Збережи картинку вручну: правою кнопкою миші або довгим натисканням на ній.';
try{if(typeof claude==='undefined'){if(!window.REPBLOB)throw 0;const u=URL.createObjectURL(window.REPBLOB),l=document.createElement('a');l.href=u;l.download='звіт_файли_папки.png';document.body.appendChild(l);l.click();l.remove();st.textContent='Картинку збережено. Прикріпи її до листа.';return}const d=await claude.use('downloads');if(!d||!window.REPBLOB){st.textContent='Автоматичне збереження недоступне. '+hint;return}
await d.save({filename:'звіт_файли_папки.png',data:window.REPBLOB});st.textContent='Картинку збережено. Прикріпи її до листа.'}
catch(e){st.textContent=e&&e.code==='declined'?'Збереження скасовано.':'Не вдалося зберегти. '+hint}}
render();
</script>
